name: star_featurecounts-umicollapse
channels:
  - bioconda
  - conda-forge
dependencies:
  # Exact match to Plasmidsaurus's methods.txt. UMICollapse is a Java tool;
  # bioconda's recipe requires openjdk>=17, pinned explicitly here for
  # reproducibility rather than left to the solver.
  - umicollapse=1.1.0
  - openjdk=17
  # samtools is only used here to re-index the deduplicated BAM (UMICollapse
  # itself does not produce a .bai); pinned to the same version as the
  # dedicated samtools_sort step for consistency.
  - samtools=1.22.1
